name: 🧪 Test Per Step

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Step mana yang mau ditest?'
        required: true
        type: choice
        options:
          - '1 - Generate Image'
          - '2 - Compose Video'
          - '3 - Upload Buffer (dry run)'
          - '3 - Upload Buffer (REAL)'
      duration:
        description: 'Durasi video detik (untuk step 2)'
        required: false
        default: '15'

env:
  NODE_VERSION: '22'
  VOD_DURATION: ${{ github.event.inputs.duration }}

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # STEP 1: Generate Image saja
  # Output: di-commit ke repo (vod-image/latest.png)
  # ══════════════════════════════════════════════════════════════════════════
  test-step-1:
    name: 📸 Step 1 - Generate Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.event.inputs.step, '1')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install system deps (canvas)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libcairo2-dev libjpeg-dev libpango1.0-dev \
            libgif-dev librsvg2-dev build-essential pkg-config

      - name: Install npm packages
        run: npm install canvas axios

      - name: 🎨 Generate gambar
        run: node scripts/generate-quote.js

      - name: ✅ Hasil
        run: |
          echo "── Output vod-image/ ──"
          ls -lah vod-image/
          echo ""
          echo "── Metadata ──"
          cat vod-image/latest-meta.json

      # ⬇️ Commit ke repo supaya Step 2 & 3 bisa pakai langsung
      - name: 💾 Commit gambar ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vod-image/
          git commit -m "🧪 [test] Step 1 image $(date '+%Y-%m-%d %H:%M')" || echo "No changes"
          git push

      # Upload artifact juga biar bisa didownload & preview langsung di Actions
      - name: 📦 Upload artifact (preview di Actions)
        uses: actions/upload-artifact@v4
        with:
          name: test-step1-image
          path: vod-image/
          retention-days: 3

  # ══════════════════════════════════════════════════════════════════════════
  # STEP 2: Compose Video saja
  # Syarat: vod-image/latest.png sudah ada di repo (jalankan Step 1 dulu)
  # Output: di-commit ke repo (vod-video/latest.mp4)
  # ══════════════════════════════════════════════════════════════════════════
  test-step-2:
    name: 🎬 Step 2 - Compose Video
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.event.inputs.step, '2')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm packages
        run: npm install axios

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      # Step 2 baca gambar langsung dari repo — tidak perlu Step 1 dijalankan di run yang sama
      - name: Cek gambar tersedia di repo
        run: |
          if [ ! -f vod-image/latest.png ]; then
            echo "❌ vod-image/latest.png belum ada di repo!"
            echo ""
            echo "Solusi: jalankan Step 1 terlebih dahulu (sekali saja),"
            echo "gambar akan tersimpan di repo dan bisa dipakai Step 2 kapan pun."
            exit 1
          fi
          echo "✅ Gambar ditemukan: $(du -sh vod-image/latest.png | cut -f1)"
          echo "── Meta ──"
          cat vod-image/latest-meta.json 2>/dev/null || echo "(tidak ada meta)"

      - name: Cek & buat aset dummy jika belum ada
        run: |
          mkdir -p assets/background assets/effect assets/music

          if ! ls assets/background/*.mp4 &>/dev/null; then
            echo "⚠️  Tidak ada background video → buat dummy gradient..."
            ffmpeg -y -f lavfi \
              -i "color=c=0x1a1a2e:size=1080x1920:rate=30" \
              -t ${{ env.VOD_DURATION }} -c:v libx264 -pix_fmt yuv420p \
              assets/background/dummy_bg.mp4 -loglevel warning
          fi

          if ! ls assets/effect/*.mp4 &>/dev/null; then
            echo "⚠️  Tidak ada effect video → buat dummy hitam 30%..."
            ffmpeg -y -f lavfi \
              -i "color=c=black:size=1080x1920:rate=30" \
              -t ${{ env.VOD_DURATION }} -c:v libx264 -pix_fmt yuv420p \
              assets/effect/dummy_effect.mp4 -loglevel warning
          fi

          if ! ls assets/music/*.mp3 &>/dev/null; then
            echo "⚠️  Tidak ada musik → buat dummy sine wave..."
            ffmpeg -y -f lavfi \
              -i "sine=frequency=220:duration=${{ env.VOD_DURATION }}" \
              -c:a libmp3lame assets/music/dummy_music.mp3 -loglevel warning
          fi

          echo ""
          echo "── Aset yang dipakai ──"
          ls assets/background/ assets/effect/ assets/music/

      - name: 🎬 Compose video
        env:
          VOD_DURATION: ${{ env.VOD_DURATION }}
        run: node scripts/compose-video.js

      - name: ✅ Hasil
        run: |
          echo "── Output vod-video/ ──"
          ls -lah vod-video/
          echo ""
          DURATION=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 vod-video/latest.mp4)
          echo "Durasi video : ${DURATION}s"
          SIZE=$(du -sh vod-video/latest.mp4 | cut -f1)
          echo "Ukuran file  : ${SIZE}"
          echo ""
          cat vod-video/latest-meta.json

      # ⬇️ Commit ke repo supaya Step 3 bisa pakai langsung tanpa artifact
      - name: 💾 Commit video ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vod-video/
          git commit -m "🧪 [test] Step 2 video $(date '+%Y-%m-%d %H:%M')" || echo "No changes"
          git push

      - name: 📦 Upload artifact (download di Actions)
        uses: actions/upload-artifact@v4
        with:
          name: test-step2-video
          path: vod-video/
          retention-days: 3

  # ══════════════════════════════════════════════════════════════════════════
  # STEP 3 DRY RUN: Cek token + lihat profil, TIDAK upload
  # Syarat: vod-video/latest.mp4 sudah ada di repo (jalankan Step 2 dulu)
  # ══════════════════════════════════════════════════════════════════════════
  test-step-3-dry:
    name: 🔍 Step 3 - Upload Buffer (DRY RUN)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.inputs.step == '3 - Upload Buffer (dry run)'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm packages
        run: npm install axios form-data

      # Step 3 baca video langsung dari repo — tidak perlu Step 2 di run yang sama
      - name: Cek video tersedia di repo
        run: |
          if [ ! -f vod-video/latest.mp4 ]; then
            echo "❌ vod-video/latest.mp4 belum ada di repo!"
            echo ""
            echo "Solusi: jalankan Step 2 terlebih dahulu (sekali saja),"
            echo "video akan tersimpan di repo dan bisa dipakai Step 3 kapan pun."
            exit 1
          fi
          echo "✅ Video ditemukan: $(du -sh vod-video/latest.mp4 | cut -f1)"

      - name: 🔍 Cek token & tampilkan daftar channel Buffer (GraphQL)
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: |
          node << 'JSEOF'
          const axios = require('axios');
          const token = process.env.BUFFER_ACCESS_TOKEN;

          if (!token) {
            console.log('❌ BUFFER_ACCESS_TOKEN belum di-set!');
            console.log('   Pergi ke: Settings → Secrets and variables → Actions → New secret');
            process.exit(1);
          }

          console.log('✅ Token ditemukan (' + token.slice(0,8) + '...' + token.slice(-4) + ')');

          const gql = (query) => axios.post('https://api.buffer.com', { query }, {
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
          });

          async function run() {
            // Step 1: Ambil organizationId dari account
            console.log('📡 Mengambil info akun...');
            const accRes = await gql('query { account { organizations { id name } } }');
            if (accRes.data.errors) throw new Error(accRes.data.errors.map(e=>e.message).join(', '));
            const orgs = accRes.data.data.account.organizations;
            if (!orgs.length) throw new Error('Tidak ada organisasi di akun ini.');
            const org = orgs[0];
            console.log('🏢 Organisasi: ' + org.name + ' (ID: ' + org.id + ')\n');

            // Step 2: Fetch channels pakai organizationId
            console.log('📡 Mengambil daftar channel...');
            const chRes = await gql(`
              query {
                channels(input: { organizationId: "${org.id}" }) {
                  id name service displayName isDisconnected
                }
              }
            `);
            if (chRes.data.errors) throw new Error(chRes.data.errors.map(e=>e.message).join(', '));
            const channels = chRes.data.data.channels || [];
            if (!channels.length) {
              console.log('⚠️  Tidak ada channel terhubung.');
              return;
            }

            console.log('Channel yang terhubung:\n');
            channels.forEach((c, i) => {
              const status = c.isDisconnected ? '⚠️  DISCONNECTED' : '✅ aktif';
              console.log('[' + (i+1) + '] ID       : ' + c.id);
              console.log('    Nama     : ' + (c.displayName || c.name));
              console.log('    Platform : ' + c.service);
              console.log('    Status   : ' + status);
              console.log('');
            });
            console.log('─────────────────────────────────────────────────');
            console.log('Copy ID channel di atas ke Secret: BUFFER_CHANNEL_IDS');
            console.log('Pisah koma jika lebih dari satu, contoh: abc123,def456');
          }

          run().catch(err => {
            const msg = err.response?.data || err.message;
            console.error('❌ Error:', typeof msg === 'object' ? JSON.stringify(msg) : msg);
            if (err.response?.status === 401) {
              console.error('   → Token tidak valid. Buat baru di: https://publish.buffer.com/settings/api');
            }
            process.exit(1);
          });
          JSEOF

      - name: 📋 Preview apa yang akan dipost ke Buffer
        run: |
          echo "── Video yang akan diupload ──"
          ls -lah vod-video/latest.mp4
          echo ""
          echo "── Metadata ──"
          cat vod-video/latest-meta.json 2>/dev/null || echo "(tidak ada meta)"
          echo ""
          echo "── Caption yang akan digunakan ──"
          node -e "
          const fs = require('fs');
          let meta = {};
          try { meta = JSON.parse(fs.readFileSync('vod-video/latest-meta.json')); } catch {}
          const today = new Date().toISOString().slice(0,10);
          const caption = '✨ Ayat Hari Ini ✨\n\n' + (meta.passage||'Alkitab') + '\n\n#alkitab #firmanTuhan #sukalogika #devotional';
          console.log(caption);
          "
          echo ""
          echo "✅ DRY RUN selesai. Tidak ada yang diupload."
          echo "   Kalau semua terlihat benar, jalankan: '3 - Upload Buffer (REAL)'"

  # ══════════════════════════════════════════════════════════════════════════
  # STEP 3 REAL: Upload beneran ke Buffer
  # Syarat: vod-video/latest.mp4 sudah ada di repo (jalankan Step 2 dulu)
  # ══════════════════════════════════════════════════════════════════════════
  test-step-3-real:
    name: 🚀 Step 3 - Upload Buffer (REAL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.step == '3 - Upload Buffer (REAL)'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm packages
        run: npm install axios form-data

      # Baca video dari repo — tidak perlu Step 2 dijalankan di run yang sama
      - name: Cek video tersedia di repo
        run: |
          if [ ! -f vod-video/latest.mp4 ]; then
            echo "❌ vod-video/latest.mp4 belum ada di repo!"
            echo ""
            echo "Solusi: jalankan Step 2 terlebih dahulu (sekali saja),"
            echo "video akan tersimpan di repo dan bisa dipakai Step 3 kapan pun."
            exit 1
          fi
          echo "✅ Video siap: $(du -sh vod-video/latest.mp4 | cut -f1)"
          cat vod-video/latest-meta.json 2>/dev/null || true

      - name: 📤 Upload ke Buffer
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_IDS:  ${{ secrets.BUFFER_CHANNEL_IDS }}
        run: node scripts/upload-buffer.js

      - name: 🎉 Summary
        run: |
          echo "## ✅ Upload ke Buffer berhasil!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat vod-video/latest-meta.json 2>/dev/null | node -e "
          const fs = require('fs');
          let meta = {};
          try { meta = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); } catch {}
          console.log('| Key | Value |');
          console.log('|-----|-------|');
          Object.entries(meta).forEach(([k,v]) => console.log('| ' + k + ' | ' + v + ' |'));
          " >> $GITHUB_STEP_SUMMARY || true
