name: 🎬 Daily VOD - Full Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Durasi video (detik)'
        required: false
        default: '30'
      skip_upload:
        description: 'Skip upload ke Buffer? (true/false)'
        required: false
        default: 'false'

env:
  NODE_VERSION: '22'
  VOD_DURATION: ${{ github.event.inputs.duration || '30' }}

jobs:

  generate-image:
    name: 📸 Generate Quote Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      image_filename: ${{ steps.rename_image.outputs.image_filename }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev librsvg2-dev build-essential pkg-config

      - run: npm install canvas axios

      - run: node scripts/generate-quote.js

      - name: Rename image to YMD format
        id: rename_image
        run: |
          ls -lah vod-image/
          test -f vod-image/latest.png
          
          DATE=$(date '+%Y-%m-%d')
          YMD_IMAGE="${DATE}.png"
          
          mv vod-image/latest.png "vod-image/${YMD_IMAGE}"
          echo "image_filename=${YMD_IMAGE}" >> $GITHUB_OUTPUT
          echo "Renamed to: ${YMD_IMAGE}"

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vod-image/
          git commit -m "📸 Daily verse $(date '+%Y-%m-%d')" || true
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: vod-image
          path: vod-image/${{ steps.rename_image.outputs.image_filename }}


  compose-video:
    name: 🎥 Compose Video
    runs-on: ubuntu-latest
    needs: generate-image
    permissions:
      contents: write
    outputs:
      vod_filename: ${{ steps.rename_video.outputs.vod_filename }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install axios

      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: actions/download-artifact@v4
        with:
          name: vod-image
          path: vod-image/

      - name: Rename downloaded image back to latest.png for compose script
        run: |
          ls -lah vod-image/
          # Cari file PNG di vod-image
          IMAGE_FILE=$(ls vod-image/*.png | head -1)
          echo "Found image: $IMAGE_FILE"
          # Copy ke latest.png agar script compose-video.js bisa menemukannya
          cp "$IMAGE_FILE" vod-image/latest.png
          echo "Created latest.png for compose script"

      - name: Ensure assets
        run: |
          mkdir -p assets/background assets/effect assets/music

          if ! ls assets/background/*.mp4 1> /dev/null 2>&1; then
            ffmpeg -y -f lavfi -i color=c=black:s=1080x1920:r=30 -t 30 assets/background/bg.mp4
          fi

          if ! ls assets/effect/*.mp4 1> /dev/null 2>&1; then
            ffmpeg -y -f lavfi -i color=c=black:s=1080x1920:r=30 -t 30 assets/effect/effect.mp4
          fi

          if ! ls assets/music/*.mp3 1> /dev/null 2>&1; then
            ffmpeg -y -f lavfi -i "sine=frequency=440:duration=30" assets/music/music.mp3
          fi

      - run: node scripts/compose-video.js

      - name: Rename video to YMD format
        id: rename_video
        run: |
          test -f vod-video/latest.mp4

          DATE=$(date '+%Y-%m-%d')
          YMD_VIDEO="${DATE}.mp4"

          mv vod-video/latest.mp4 "vod-video/${YMD_VIDEO}"
          echo "vod_filename=${YMD_VIDEO}" >> $GITHUB_OUTPUT
          echo "Renamed to: ${YMD_VIDEO}"

      - run: |
          ls -lah vod-video/

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vod-video/
          git commit -m "🎬 Daily VOD $(date '+%Y-%m-%d').mp4" || true
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: vod-video
          path: vod-video/${{ steps.rename_video.outputs.vod_filename }}


  upload-buffer:
    name: 🚀 Upload Buffer
    runs-on: ubuntu-latest
    needs: compose-video
    if: ${{ github.event.inputs.skip_upload != 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install axios form-data

      - run: git pull origin main

      - name: Wait for GitHub raw ready
        run: sleep 20

      - name: Validate file
        run: |
          test -f "vod-video/${{ needs.compose-video.outputs.vod_filename }}"
          echo "Video file: ${{ needs.compose-video.outputs.vod_filename }}"

      - name: Upload ke Buffer
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_IDS:  ${{ secrets.BUFFER_CHANNEL_IDS }}
          BUFFER_VIDEO_URL: "https://raw.githubusercontent.com/${{ github.repository }}/main/vod-video/${{ needs.compose-video.outputs.vod_filename }}?v=${{ github.run_id }}"
        run: node scripts/upload-buffer.js
