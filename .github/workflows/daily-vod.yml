name: 🎬 Daily VOD - Full Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Durasi video (detik)'
        required: false
        default: '30'
      skip_upload:
        description: 'Skip upload ke Buffer? (true/false)'
        required: false
        default: 'false'

env:
  NODE_VERSION: '22'
  VOD_DURATION: ${{ github.event.inputs.duration || '30' }}

jobs:

  generate-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev librsvg2-dev build-essential pkg-config

      - run: npm install canvas axios

      - run: node scripts/generate-quote.js

      - run: |
          if [ ! -f vod-image/latest.png ]; then exit 1; fi

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vod-image/
          git commit -m "📸 $(date '+%Y-%m-%d')" || true
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: vod-image
          path: vod-image/*

  compose-video:
    runs-on: ubuntu-latest
    needs: generate-image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - run: git pull origin main

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install axios

      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: actions/download-artifact@v4
        with:
          name: vod-image
          path: vod-image/

      - run: node scripts/compose-video.js

      - name: Verify video
        run: |
          if [ ! -f vod-video/latest.mp4 ]; then exit 1; fi

      # 🔥 RENAME DI SINI
      - name: Rename video
        run: |
          DATE=$(date '+%Y-%m-%d')
          NEW_NAME="vod-${DATE}.mp4"
          mv vod-video/latest.mp4 "vod-video/${NEW_NAME}"
          echo "NEW_NAME=${NEW_NAME}" >> $GITHUB_ENV

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vod-video/
          git commit -m "🎬 $(date '+%Y-%m-%d')" || true
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: vod-video
          path: vod-video/*.mp4

  upload-buffer:
    runs-on: ubuntu-latest
    needs: compose-video
    if: ${{ github.event.inputs.skip_upload != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - run: git pull origin main

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install axios form-data

      # 🔥 SET ULANG NAMA (biar konsisten antar job)
      - name: Set filename
        run: |
          DATE=$(date '+%Y-%m-%d')
          echo "NEW_NAME=vod-${DATE}.mp4" >> $GITHUB_ENV

      - name: Verify video
        run: |
          ls -lah vod-video/
          if [ ! -f "vod-video/${NEW_NAME}" ]; then
            echo "Video tidak ditemukan"
            exit 1
          fi

      - name: Upload ke Buffer
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_IDS:  ${{ secrets.BUFFER_CHANNEL_IDS }}
          BUFFER_VIDEO_URL: "https://raw.githubusercontent.com/${{ github.repository }}/main/vod-video/${{ env.NEW_NAME }}"
        run: node scripts/upload-buffer.js
