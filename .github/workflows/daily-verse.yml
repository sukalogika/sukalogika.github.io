name: Daily Verse - Generate Image Only

on:
  schedule:
    - cron: '0 0 * * *'   # Jam 7 pagi WIB
  workflow_dispatch:

jobs:
  generate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install canvas dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev build-essential

      - name: Install npm packages
        run: npm install canvas axios

      - name: Generate quote image
        run: node scripts/generate-quote.js

      - name: Push image to repository
        run: |
          git config user.name "github-actions[bot]"
          git config.user.email "github-actions[bot]@users.noreply.github.com"
          git add vod-image/
          git commit -m "📸 Daily verse image $(date '+%Y-%m-%d')" || echo "No changes to commit"
          git push
