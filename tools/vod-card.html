<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church IG Post Generator - Premium Pro V3</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        .font-serif-elegant { font-family: 'Playfair Display', serif; }
        .font-sans-clean { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        #zoomSlider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #4a4238;
            outline: none;
            border-radius: 3px;
        }
        #zoomSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #d97706;
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid #F8F6F0;
        }
    </style>
</head>
<body class="bg-stone-900 flex flex-col items-center p-4 text-stone-800 min-h-screen font-sans-clean select-none">

    <!-- Panel Kontrol -->
    <div class="mb-6 flex flex-col gap-4 w-full max-w-lg bg-stone-800 p-5 rounded-2xl border border-stone-700 text-stone-200 shadow-xl">
        <h2 class="text-lg font-bold border-b border-stone-600 pb-2 flex justify-between items-center">
            <span>Church Post Studio</span>
            <span class="text-xs bg-amber-600 px-2 py-0.5 rounded text-white">Mobile Ready</span>
        </h2>
        
        <!-- 1. Upload Foto & Logo -->
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="text-xs text-stone-400 block mb-1">Foto Utama (4:3):</label>
                <input type="file" id="imageInput" accept="image/*" class="w-full text-xs text-stone-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:bg-stone-700 file:text-stone-200 cursor-pointer">
            </div>
            <div>
                <label class="text-xs text-stone-400 block mb-1">Upload Logo Gereja:</label>
                <input type="file" id="logoInput" accept="image/*" class="w-full text-xs text-stone-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:bg-stone-700 file:text-stone-200 cursor-pointer">
            </div>
        </div>

        <!-- 2. Zoom Control -->
        <div class="flex flex-col gap-1 p-2 bg-stone-700/40 rounded-xl border border-stone-600/50">
            <div class="flex items-center justify-between text-xs text-stone-400">
                <span>ZOOM KONTROL</span>
                <span class="italic text-[10px] text-amber-500">* Di HP bisa cubit gambar (Pinch to Zoom)</span>
            </div>
            <input type="range" id="zoomSlider" min="1" max="4" step="0.01" value="1">
        </div>

        <!-- 3. Theme Switcher -->
        <div>
            <label class="text-xs text-stone-400 block mb-1">Pilih Tema Warna:</label>
            <div class="grid grid-cols-2 gap-2">
                <button id="themeLight" class="py-2 rounded-lg font-semibold text-xs border border-amber-600 bg-amber-600 text-white transition-all">☀️ Light (Cream Warm)</button>
                <button id="themeDark" class="py-2 rounded-lg font-semibold text-xs border border-stone-600 bg-stone-700 text-stone-300 transition-all">🌙 Dark (Elegant Night)</button>
            </div>
        </div>

        <!-- 4. Preset & Custom Teks Area -->
        <div class="flex flex-col gap-2">
            <div>
                <label class="text-xs text-stone-400 block mb-1">Template Cepat (Opsional):</label>
                <select id="versePreset" class="p-2 w-full bg-stone-700 rounded-lg text-white border-none text-xs outline-none">
                    <option value="">-- Gunakan Teks Kustom Anda Sendiri --</option>
                    <option value="Sebab Aku ini mengetahui rancangan-rancangan apa yang ada pada-Ku mengenai kamu, demikianlah firman TUHAN, yaitu rancangan damai sejahtera...|Yeremia 29:11">Yeremia 29:11</option>
                    <option value="Segala perkara dapat kutanggung di dalam Dia yang memberi kekuatan kepadaku.|Filipi 4:13">Filipi 4:13</option>
                    <option value="Tetapi orang-orang yang menanti-nantikan TUHAN mendapat kekuatan baru: mereka seumpama rajawali yang naik terbang dengan kekuatan sayapnya...|Yesaya 40:31">Yesaya 40:31</option>
                </select>
            </div>
            
            <div>
                <label class="text-xs text-stone-400 block mb-1">Isi Ayat:</label>
                <textarea id="verseTextArea" rows="3" class="w-full p-2 bg-stone-700 rounded-lg text-white text-xs border-none outline-none focus:ring-1 focus:ring-amber-500 resize-none" placeholder="Tulis atau edit ayat di sini..."></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs text-stone-400 block mb-1">Referensi Kitab:</label>
                    <input type="text" id="verseRefInput" class="w-full p-2 bg-stone-700 rounded-lg text-white text-xs border-none outline-none focus:ring-1 focus:ring-amber-500" placeholder="Contoh: Mazmur 23:1">
                </div>
                <div>
                    <!-- FIELD BARU UNTUK INPUT USERNAME -->
                    <label class="text-xs text-stone-400 block mb-1">Username Sosmed:</label>
                    <input type="text" id="igHandleInput" class="w-full p-2 bg-stone-700 rounded-lg text-white text-xs border-none outline-none focus:ring-1 focus:ring-amber-500" value="@sukalogika" placeholder="Contoh: @sukalogika">
                </div>
            </div>
        </div>

        <button id="saveBtn" class="bg-amber-600 hover:bg-amber-500 text-white py-3 rounded-xl font-bold transition-colors shadow-lg mt-1 text-sm">
            Download Hasil (FHD 1080x1350)
        </button>
    </div>

    <!-- TAMPILAN POSTINGAN INSTAGRAM (Rasio 4:5 - 540x675) -->
    <div class="overflow-auto max-w-full pb-10">
        <div id="ig-post" class="bg-[#F8F6F0] w-[540px] h-[675px] rounded-sm shadow-2xl relative box-border mx-auto shrink-0 flex flex-col p-8 overflow-hidden text-stone-800 transition-colors duration-300">
            
            <div id="topBar" class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-amber-200 via-amber-400 to-amber-200"></div>

            <!-- Header dengan Auto-date & Logo Upload -->
            <div class="flex justify-between items-start mb-5 mt-2">
                <div class="flex flex-col">
                    <span class="text-xs tracking-[0.2em] text-stone-500 uppercase font-bold" id="displayDate">SUNDAY, 28 JUNE 2026</span>
                    <span id="subHeaderTitle" class="text-lg font-extrabold text-stone-800">Verse of the Day</span>
                </div>
                <!-- Wadah Logo -->
                <div id="logoContainer" class="w-12 h-12 flex items-center justify-center overflow-hidden rounded-full border border-stone-300/50 bg-white/30 p-1">
                    <span id="logoPlaceholder" class="text-xl text-amber-600 font-bold">✝</span>
                    <img id="logoImage" src="" alt="Logo" class="hidden max-w-full max-h-full object-contain">
                </div>
            </div>

            <!-- Frame Gambar (Rasio 4:3) - TERUPDATE: max-w-full max-h-full tanpa absolute -->
            <div id="imageFrame" class="w-full aspect-[4/3] bg-stone-200/60 rounded-2xl shadow-[0_10px_35px_rgba(0,0,0,0.06)] flex items-center justify-center overflow-hidden border-[4px] border-white relative cursor-move touch-none">
                <span id="placeholderText" class="text-stone-400 font-semibold tracking-wider text-xs absolute pointer-events-none">Ketuk / Geser Foto...</span>
                <img id="rawImage" src="" alt="Post" class="hidden origin-center max-w-full max-h-full block relative z-10" style="transform: translate(0px, 0px) scale(1);">
            </div>

            <!-- Custom Text Area Target (Teks Tengah) -->
            <div class="flex-grow flex flex-col justify-center items-center text-center mt-4 px-2">
                <p id="verseText" class="font-serif-elegant text-xl leading-relaxed italic text-stone-800">
                    "Tulis ayat Anda melalui kolom input teks di panel atas."
                </p>
                <p id="verseRef" class="mt-3 text-xs font-bold text-amber-700 tracking-widest uppercase">
                    — Kitab 1:1
                </p>
            </div>

            <!-- Footer minimalis -->
            <div id="footerBar" class="mt-auto flex justify-between items-center border-t border-stone-300/60 pt-4 text-stone-500 text-[11px] font-bold tracking-wider">
                <span>GOD BLESS YOU</span>
                <span class="flex items-center gap-1" id="displayIgHandle">@sukalogika</span>
            </div>
            
        </div>
    </div>

    <script>
        // DOM Elements Control
        const imageInput = document.getElementById('imageInput');
        const logoInput = document.getElementById('logoInput');
        const zoomSlider = document.getElementById('zoomSlider');
        const themeLight = document.getElementById('themeLight');
        const themeDark = document.getElementById('themeDark');
        const versePreset = document.getElementById('versePreset');
        const verseTextArea = document.getElementById('verseTextArea');
        const verseRefInput = document.getElementById('verseRefInput');
        const igHandleInput = document.getElementById('igHandleInput');
        
        // DOM Elements Card Target
        const igPost = document.getElementById('ig-post');
        const subHeaderTitle = document.getElementById('subHeaderTitle');
        const displayDate = document.getElementById('displayDate');
        const logoPlaceholder = document.getElementById('logoPlaceholder');
        const logoImage = document.getElementById('logoImage');
        const imageFrame = document.getElementById('imageFrame');
        const rawImage = document.getElementById('rawImage');
        const placeholderText = document.getElementById('placeholderText');
        const verseText = document.getElementById('verseText');
        const verseRef = document.getElementById('verseRef');
        const footerBar = document.getElementById('footerBar');
        const displayIgHandle = document.getElementById('displayIgHandle');

        // State Variabel untuk Transformasi Gambar
        let isDragging = false;
        let startX, startY, translateX = 0, translateY = 0, currentScale = 1;
        let initialTouchDist = 0, initialScale = 1;

        // --- 1. FITUR AUTO DATE ---
        function applyAutoDate() {
            const opsi = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            const hariIni = new Date().toLocaleDateString('id-ID', opsi).toUpperCase();
            displayDate.textContent = hariIni;
        }
        applyAutoDate();

        // --- 2. FITUR CUSTOM TEXT AREA & PRESET ---
        function updateCardText() {
            verseText.textContent = verseTextArea.value ? `"${verseTextArea.value}"` : `"..."`;
            verseRef.textContent = verseRefInput.value ? `— ${verseRefInput.value}` : '';
        }

        versePreset.addEventListener('change', (e) => {
            if (e.target.value) {
                const [text, ref] = e.target.value.split('|');
                verseTextArea.value = text;
                verseRefInput.value = ref;
                updateCardText();
            }
        });

        verseTextArea.addEventListener('input', updateCardText);
        verseRefInput.addEventListener('input', updateCardText);

        igHandleInput.addEventListener('input', (e) => {
            displayIgHandle.textContent = e.target.value || '';
        });

        // --- 3. FITUR UPLOAD LOGO GEREJA ---
        logoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    logoImage.src = event.target.result;
                    logoImage.classList.remove('hidden');
                    logoPlaceholder.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // --- 4. THEME SWITCHER LOGIC ---
        themeLight.addEventListener('click', () => {
            themeLight.className = "py-2 rounded-lg font-semibold text-xs border border-amber-600 bg-amber-600 text-white transition-all";
            themeDark.className = "py-2 rounded-lg font-semibold text-xs border border-stone-600 bg-stone-700 text-stone-300 transition-all";
            
            igPost.style.backgroundColor = "#F8F6F0";
            subHeaderTitle.className = "text-lg font-extrabold text-stone-800";
            verseText.className = "font-serif-elegant text-xl leading-relaxed italic text-stone-800";
            verseRef.className = "mt-3 text-xs font-bold text-amber-700 tracking-widest uppercase";
            footerBar.className = "mt-auto flex justify-between items-center border-t border-stone-300/60 pt-4 text-stone-500 text-[11px] font-bold tracking-wider bg-[#F8F6F0]";
        });

        themeDark.addEventListener('click', () => {
            themeDark.className = "py-2 rounded-lg font-semibold text-xs border border-amber-500 bg-amber-500 text-white transition-all";
            themeLight.className = "py-2 rounded-lg font-semibold text-xs border border-stone-600 bg-stone-700 text-stone-300 transition-all";
            
            igPost.style.backgroundColor = "#1C1A17";
            subHeaderTitle.className = "text-lg font-extrabold text-stone-100";
            verseText.className = "font-serif-elegant text-xl leading-relaxed italic text-stone-200";
            verseRef.className = "mt-3 text-xs font-bold text-amber-400 tracking-widest uppercase";
            footerBar.className = "mt-auto flex justify-between items-center border-t border-stone-700 pt-4 text-stone-400 text-[11px] font-bold tracking-wider bg-[#1C1A17]";
        });

        // --- 5. INTERAKSI GAMBAR (UPLOAD, PANNING, SLIDER, PINCH TO ZOOM) ---
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    rawImage.src = event.target.result;
                    rawImage.classList.remove('hidden');
                    placeholderText.classList.add('hidden');
                    translateX = 0; translateY = 0; currentScale = 1; zoomSlider.value = 1;
                    updateImageTransform();
                };
                reader.readAsDataURL(file);
            }
        });

        function updateImageTransform() {
            rawImage.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
        }

        zoomSlider.addEventListener('input', (e) => {
            currentScale = parseFloat(e.target.value);
            updateImageTransform();
        });

        imageFrame.addEventListener('pointerdown', (e) => {
            if (!rawImage.src || e.pointerType === 'touch' && e.isPrimary === false) return;
            isDragging = true;
            imageFrame.setPointerCapture(e.pointerId);
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
        });

        imageFrame.addEventListener('pointermove', (e) => {
            if (!isDragging || !rawImage.src) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateImageTransform();
        });

        const stopDrag = () => { isDragging = false; };
        imageFrame.addEventListener('pointerup', stopDrag);
        imageFrame.addEventListener('pointercancel', stopDrag);

        imageFrame.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2 && rawImage.src) {
                isDragging = false;
                initialTouchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialScale = currentScale;
            }
        });

        imageFrame.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialTouchDist > 0 && rawImage.src) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                let scaleFactor = currentDist / initialTouchDist;
                currentScale = Math.min(Math.max(initialScale * scaleFactor, 1), 4);
                zoomSlider.value = currentScale;
                updateImageTransform();
            }
        });

        imageFrame.addEventListener('touchend', () => { initialTouchDist = 0; });

        // Inisialisasi Teks Default Input
        verseTextArea.value = "Sebab Aku ini mengetahui rancangan-rancangan apa yang ada pada-Ku mengenai kamu, demikianlah firman TUHAN, yaitu rancangan damai sejahtera...";
        verseRefInput.value = "Yeremia 29:11";
        updateCardText();

        // --- 6. RENDER GENERATOR DAN EKSPOR ---
        saveBtn.addEventListener('click', () => {
            const originalText = saveBtn.textContent;
            saveBtn.textContent = 'Menyimpan FHD...';
            saveBtn.disabled = true;

            html2canvas(igPost, { 
                scale: 2, 
                useCORS: true, 
                backgroundColor: null 
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'postingan-gereja-fhd.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                saveBtn.textContent = originalText;
                saveBtn.disabled = false;
            }).catch(err => {
                console.error(err);
                saveBtn.textContent = originalText;
                saveBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
