<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember Warna</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e6;--panel:#ffe0a3;--panel2:#ffd07a;--ink:#3b2f1e;--btn:#fff;--shadow:rgba(0,0,0,.18);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a2e;--panel:#352c52;--panel2:#473b6e;--ink:#f4efff;--btn:#4b3f75;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1a2e;--panel:#352c52;--panel2:#473b6e;--ink:#f4efff;--btn:#4b3f75;--shadow:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Fredoka','Baloo 2','Comic Sans MS',system-ui,sans-serif;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{height:100%;display:grid;grid-template-rows:2fr 1fr}
#top{display:flex;flex-direction:column;min-height:0}
#bar{display:flex;align-items:center;gap:6px;padding:8px 10px}
#bar h1{font-size:20px;margin:0;flex:1;white-space:nowrap}
.btn{border:0;background:var(--btn);color:var(--ink);font-size:21px;width:42px;height:42px;position:relative;flex:none;border-radius:16px;box-shadow:0 3px 0 var(--shadow);cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.btn.on{background:#fde047;color:#3b2f1e;outline:3px solid #f97316}
.btn[data-s]:not([data-s=""])::after{content:attr(data-s);position:absolute;right:-4px;bottom:-4px;background:#ef4444;color:#fff;font-size:11px;border-radius:99px;padding:0 5px;line-height:16px}
#scope{position:fixed;left:0;top:0;width:0;height:0;display:none;pointer-events:none;z-index:40}
#scope i{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border:3px solid #ef4444;border-radius:50%;box-shadow:0 0 0 2px #fff,inset 0 0 0 2px #fff;background:rgba(255,255,255,.2)}
#scope i::before,#scope i::after{content:"";position:absolute;background:#ef4444;box-shadow:0 0 0 1px #fff}
#scope i::before{left:-12px;right:-12px;top:calc(50% - 1px);height:2px}
#scope i::after{top:-12px;bottom:-12px;left:calc(50% - 1px);width:2px}
#scope.bad i{border-color:#94a3b8}
#scope b{position:absolute;left:4px;bottom:4px;width:64px;height:64px;transform-origin:0 100%;transform:rotate(-12deg);filter:drop-shadow(0 4px 3px var(--shadow))}
#scope b svg{width:100%;height:100%}
#pv{position:fixed;display:none;pointer-events:none;z-index:15;border-radius:14px;animation:pvp .7s ease-in-out infinite alternate}
@keyframes pvp{from{opacity:.45}to{opacity:.85}}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 10px 8px}
#cv{background:#fff;border-radius:14px;box-shadow:0 6px 0 var(--shadow);touch-action:none;transition:transform .15s}
#cv.over{outline:5px dashed #f97316;outline-offset:3px}
#cv.pop{transform:scale(1.015)}
#pal{background:var(--panel);border-radius:28px 28px 0 0;padding:10px 8px calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr);gap:4px;min-height:0;box-shadow:0 -4px 0 var(--panel2)}
.bk{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;touch-action:none;cursor:grab;border-radius:18px;transition:transform .12s,background .12s}
.bk svg{height:92%;max-width:100%;pointer-events:none;filter:drop-shadow(0 3px 0 var(--shadow))}
.bk.sel{background:rgba(255,255,255,.45);transform:translateY(-4px) scale(1.06)}
#ghost{position:fixed;left:0;top:0;width:76px;height:76px;pointer-events:none;z-index:50;display:none;filter:drop-shadow(0 8px 6px var(--shadow))}
#ghost svg{width:100%;height:100%}
#hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);background:#1e293b;color:#fff;padding:8px 14px;border-radius:99px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;white-space:nowrap}
#hint.on{opacity:.92}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="bar">
      <h1>🎨 Ember Warna</h1>
      <button class="btn on" id="bBucket" aria-label="Mode ember">🪣</button>
      <button class="btn" id="bSniper" aria-label="Mode sniper">🎯</button>
      <button class="btn" id="bLoad" aria-label="Buka gambar">📂</button>
      <button class="btn" id="bUndo" aria-label="Urungkan">↩️</button>
      <button class="btn" id="bReset" aria-label="Ulangi">🗑️</button>
      <button class="btn" id="bSave" aria-label="Simpan">💾</button>
    </div>
    <div id="stage"><canvas id="cv" width="800" height="600"></canvas></div>
  </div>
  <div id="pal"></div>
</div>
<div id="ghost"></div>
<div id="scope"><b></b><i></i></div>
<canvas id="pv"></canvas>
<div id="hint"></div>
<input type="file" id="file" accept="image/*" hidden>
<script>
const COLORS=['#ef4444','#f97316','#facc15','#a3e635','#22c55e','#14b8a6','#7dd3fc','#3b82f6','#8b5cf6','#ec4899','#92400e','#ffffff'];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
const pal=document.getElementById('pal'),ghost=document.getElementById('ghost'),stage=document.getElementById('stage');
let sel=COLORS[0],undo=[],orig=null,audio=null;

function bucketSVG(c){return `<svg viewBox="0 0 64 64"><path d="M14 24Q32-4 50 24" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/><path d="M10 24H54L48 58Q32 63 16 58Z" fill="${c}" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/><ellipse cx="32" cy="24" rx="22" ry="6" fill="${c}" stroke="#1e293b" stroke-width="3"/><ellipse cx="32" cy="24" rx="22" ry="6" fill="#fff" opacity=".35"/><path d="M20 34v14" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".5"/></svg>`}
COLORS.forEach(c=>{const d=document.createElement('div');d.className='bk';d.dataset.c=c;d.innerHTML=bucketSVG(c);pal.appendChild(d)});
function mark(){[...pal.children].forEach(e=>e.classList.toggle('sel',e.dataset.c===sel))}mark();

function hint(t){const h=document.getElementById('hint');h.textContent=t;h.classList.add('on');clearTimeout(hint.t);hint.t=setTimeout(()=>h.classList.remove('on'),2200)}
function blip(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(500,audio.currentTime);o.frequency.exponentialRampToValueAtTime(900,audio.currentTime+.12);g.gain.setValueAtTime(.15,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.2)}catch(e){}}

function sample(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,800,600);
  ctx.strokeStyle='#111';ctx.lineWidth=6;ctx.lineJoin='round';ctx.lineCap='round';
  const P=f=>{ctx.beginPath();f();ctx.stroke()};
  P(()=>{ctx.arc(660,120,50,0,7)});
  for(let i=0;i<10;i++){const a=i*Math.PI/5;P(()=>{ctx.moveTo(660+Math.cos(a)*62,120+Math.sin(a)*62);ctx.lineTo(660+Math.cos(a)*88,120+Math.sin(a)*88)})}
  P(()=>{ctx.moveTo(90,120);ctx.arc(120,110,30,Math.PI,0);ctx.arc(170,105,38,Math.PI,0);ctx.arc(225,115,28,Math.PI,0.2*Math.PI);ctx.lineTo(90,142);ctx.closePath()});
  P(()=>{ctx.moveTo(0,470);ctx.quadraticCurveTo(200,430,400,470);ctx.quadraticCurveTo(600,510,800,460)});
  P(()=>{ctx.rect(150,270,260,200)});
  P(()=>{ctx.moveTo(130,270);ctx.lineTo(280,160);ctx.lineTo(430,270);ctx.closePath()});
  P(()=>{ctx.rect(250,360,60,110)});
  P(()=>{ctx.rect(180,300,50,50)});P(()=>{ctx.rect(340,300,50,50)});
  P(()=>{ctx.rect(590,330,36,140)});
  P(()=>{ctx.arc(608,280,80,0,7)});
  ctx.fillStyle='#fff';
  P(()=>{ctx.moveTo(0,470);ctx.quadraticCurveTo(200,430,400,470);ctx.quadraticCurveTo(600,510,800,460);ctx.lineTo(800,600);ctx.lineTo(0,600);ctx.closePath()});
  P(()=>{ctx.moveTo(0,470);ctx.quadraticCurveTo(200,430,400,470);ctx.quadraticCurveTo(600,510,800,460)});
  P(()=>{ctx.rect(590,330,36,140)});
  finish();
}
function finish(){orig=ctx.getImageData(0,0,cv.width,cv.height);undo=[];layout()}
function layout(){const r=stage.getBoundingClientRect(),W=r.width-20,H=r.height-8,s=Math.min(W/cv.width,H/cv.height);cv.style.width=Math.floor(cv.width*s)+'px';cv.style.height=Math.floor(cv.height*s)+'px'}
addEventListener('resize',layout);

function hex(c){return[parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)]}
let FT=150,FL=80,PREV=false;
function flood(px,py,color){
  const w=cv.width,h=cv.height;px|=0;py|=0;
  if(px<0||py<0||px>=w||py>=h)return false;
  const img=ctx.getImageData(0,0,w,h),d=img.data,i0=(py*w+px)*4;
  const sr=d[i0],sg=d[i0+1],sb=d[i0+2],[r,g,b]=hex(color);
  if(isLine(i0))return false;
  if(Math.abs(sr-r)+Math.abs(sg-g)+Math.abs(sb-b)<10)return false;
  const ok=i=>Math.abs(d[i]-sr)+Math.abs(d[i+1]-sg)+Math.abs(d[i+2]-sb)<=FT&&!isLine(i);
  const seen=new Uint8Array(w*h),st=[px,py];
  while(st.length){
    let y=st.pop(),x=st.pop(),k=y*w+x;
    while(x>0&&!seen[k-1]&&ok((k-1)*4)){x--;k--}
    let up=false,dn=false;
    while(x<w&&!seen[k]&&ok(k*4)){
      seen[k]=1;const i=k*4;d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=255;
      if(y>0){const u=k-w;if(!seen[u]&&ok(u*4)){if(!up){st.push(x,y-1);up=true}}else up=false}
      if(y<h-1){const v=k+w;if(!seen[v]&&ok(v*4)){if(!dn){st.push(x,y+1);dn=true}}else dn=false}
      x++;k++;
    }
  }
  if(PREV)return seen;
  ctx.putImageData(img,0,0);return true;
}
function isLine(i){const o=orig.data;return (o[i]+o[i+1]+o[i+2])/3<FL}
let tool='bucket';
function pushUndo(){undo.push(ctx.getImageData(0,0,cv.width,cv.height));if(undo.length>12)undo.shift()}
function toCv(cx,cy){const r=cv.getBoundingClientRect();if(cx<r.left||cx>r.right||cy<r.top||cy>r.bottom)return null;return[(cx-r.left)/r.width*cv.width,(cy-r.top)/r.height*cv.height]}
function detailFill(x,y,color,preview){
  FT=200;FL=65;PREV=!!preview;
  const res=flood(x,y,color);
  FT=150;FL=80;PREV=false;return res;
}
function paintAt(cx,cy,color){
  const p=toCv(cx,cy);if(!p)return;
  pushUndo();
  const ok=tool==='sniper'?detailFill(p[0],p[1],color,false):flood(p[0],p[1],color);
  if(ok){blip();cv.classList.add('pop');setTimeout(()=>cv.classList.remove('pop'),150)}
  else{undo.pop();hint('Arahkan ke bagian putih ya 😊')}
}
// sniper: ember presisi. Ujung ember (lingkaran merah) = titik isi, ada pratinjau area yang akan terisi
const scope=document.getElementById('scope'),pv=document.getElementById('pv'),pvx=pv.getContext('2d');
let lastKey='',scopeC='',sp=null;
function setScopeColor(){if(scopeC===sel)return;scopeC=sel;scope.querySelector('b').innerHTML=bucketSVG(sel)}
function aim(cx,cy){
  const x=cx,y=cy-OFF;
  setScopeColor();
  scope.style.transform='translate('+x+'px,'+y+'px)';scope.style.display='block';
  const p=toCv(x,y);
  if(!p){pv.style.display='none';lastKey='';scope.classList.add('bad');return}
  const k=(p[0]|0)+','+(p[1]|0)+sel;if(k===lastKey)return;lastKey=k;
  const m=detailFill(p[0],p[1],sel,true);
  scope.classList.toggle('bad',!m);
  if(!m){pv.style.display='none';return}
  const w=cv.width,h=cv.height,r=cv.getBoundingClientRect();
  pv.width=w;pv.height=h;
  pv.style.cssText='display:block;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px';
  const im=pvx.createImageData(w,h),d=im.data,c=hex(sel);
  for(let i=0;i<m.length;i++)if(m[i]){const j=i*4;d[j]=c[0];d[j+1]=c[1];d[j+2]=c[2];d[j+3]=190}
  pvx.putImageData(im,0,0);
}
function clearAim(){scope.style.display='none';pv.style.display='none';lastKey=''}
cv.addEventListener('pointerdown',e=>{
  if(tool==='sniper'){cv.setPointerCapture(e.pointerId);sp=e.pointerId;aim(e.clientX,e.clientY);return}
  paintAt(e.clientX,e.clientY,sel);
});
cv.addEventListener('pointermove',e=>{if(sp===e.pointerId)aim(e.clientX,e.clientY)});
function endS(e,go){if(sp!==e.pointerId)return;sp=null;if(go)paintAt(e.clientX,e.clientY-OFF,sel);clearAim()}
cv.addEventListener('pointerup',e=>endS(e,true));
cv.addEventListener('pointercancel',e=>endS(e,false));
const bB=document.getElementById('bBucket'),bS=document.getElementById('bSniper');
function setTool(t){tool=t;bB.classList.toggle('on',t==='bucket');bS.classList.toggle('on',t==='sniper');if(t!=='sniper')clearAim()}
bB.onclick=()=>{setTool('bucket');hint('Mode ember biasa 🪣')};
bS.onclick=()=>{setTool('sniper');hint('Sniper 🎯: tahan & geser, ujung ember = tempat cat. Lepas untuk mengisi')};
setTool('bucket');

// drag buckets
let drag=null;const OFF=64;
pal.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.bk');if(!b)return;
  b.setPointerCapture(e.pointerId);
  sel=b.dataset.c;mark();
  drag={b,x:e.clientX,y:e.clientY,on:false,id:e.pointerId};
  ghost.innerHTML=bucketSVG(sel);
});
pal.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){drag.on=true;ghost.style.display='block'}
  if(drag.on){
    ghost.style.transform=`translate(${e.clientX-38}px,${e.clientY-38-OFF}px) rotate(-12deg)`;
    const r=cv.getBoundingClientRect(),x=e.clientX,y=e.clientY-OFF;
    cv.classList.toggle('over',x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom);
    ghost.style.visibility=tool==='sniper'?'hidden':'visible';
    if(tool==='sniper')aim(e.clientX,e.clientY);
  }
});
function endDrag(e,drop){
  if(!drag)return;
  if(drag.on&&drop)paintAt(e.clientX,e.clientY-OFF,sel);
  else if(!drag.on&&drop&&!localStorageSafe.shown){localStorageSafe.shown=1;hint('Geser ember ke gambar, atau tap gambar 👆')}
  ghost.style.display='none';cv.classList.remove('over');drag=null;clearAim();
}
const localStorageSafe={};
pal.addEventListener('pointerup',e=>endDrag(e,true));
pal.addEventListener('pointercancel',e=>endDrag(e,false));

// toolbar
document.getElementById('bUndo').onclick=()=>{const u=undo.pop();if(u)ctx.putImageData(u,0,0);else hint('Belum ada yang bisa diurungkan')};
document.getElementById('bReset').onclick=()=>{if(orig){undo=[];ctx.putImageData(orig,0,0)}};
document.getElementById('bLoad').onclick=()=>document.getElementById('file').click();
document.getElementById('bSave').onclick=async()=>{
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  if(!blob){hint('Gagal membuat PNG 😢');return}
  try{
    const dl=window.claude&&await window.claude.use('downloads');
    if(dl){await dl.save({filename:'gambarku.png',data:blob});hint('Gambar disimpan 🎉');return}
  }catch(err){if(err&&err.code==='declined')return;hint('Simpan gagal, coba lagi ya 😢');return}
  try{
    const f=new File([blob],'gambarku.png',{type:'image/png'});
    if(/Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Gambarku'});return}
  }catch(err){if(err&&err.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gambarku.png';document.body.appendChild(a);a.click();a.remove();hint('Gambar disimpan 🎉')}catch(e){hint('Simpan tidak tersedia di sini')}
};
function loadSrc(src,fallback){
  const img=new Image();img.onload=()=>{
    const m=900,s=Math.min(1,m/Math.max(img.width,img.height));
    cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
    ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0,cv.width,cv.height);
    if(src.startsWith('blob:'))URL.revokeObjectURL(src);
    finish();hint('Gambar siap diwarnai!');
  };
  img.onerror=()=>{hint('Gambar tidak bisa dibuka 😢');if(fallback)sample()};
  img.src=src;
}
document.getElementById('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  loadSrc(URL.createObjectURL(f));e.target.value='';
